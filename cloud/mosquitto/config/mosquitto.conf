# Mosquitto MQTT Broker Configuration
# Dokumentasi: https://mosquitto.org/man/mosquitto-conf-5.html

# ==========================================
# LISTENER - Port untuk MQTT connections
# ==========================================
# Port 1883: MQTT (tanpa enkripsi) - untuk internal communication
listener 1883 0.0.0.0

# Port 8883: MQTT over TLS (encrypted) - untuk IoT devices di field
# (Uncomment jika sudah punya SSL certificates)
# listener 8883 0.0.0.0
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# cafile /mosquitto/certs/ca.crt
# tls_version tlsv1.2

# ==========================================
# AUTHENTICATION
# ==========================================
# allow_anonymous true  → TESTING SAJA! Semua device bisa connect
# allow_anonymous false → PRODUCTION! Perlu username/password
allow_anonymous true

# Password file (uncomment jika di production)
# password_file /mosquitto/config/passwd
# Cara generate: mosquitto_passwd -c /mosquitto/config/passwd username

# ==========================================
# PERSISTENCE
# ==========================================
# Simpan messages agar tidak hilang saat broker restart
persistence true
persistence_location /mosquitto/data/

# ==========================================
# LOGGING
# ==========================================
# Log ke file dan stdout
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Log level: debug, info, notice, warning, error
log_type all

# ==========================================
# SECURITY
# ==========================================
# Max clients yang bisa connect sekaligus
max_connections -1

# Max queued messages per client
max_queued_messages 1000

# Timeout idle client (seconds)
persistent_client_expiration 7d

# ==========================================
# PERFORMANCE
# ==========================================
# Max file descriptors
max_inflight_messages 20

# Thread pool size untuk async message processing
# Sesuaikan dengan CPU cores VM
# thread_pool_size 4